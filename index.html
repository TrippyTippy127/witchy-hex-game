<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Witchy Hex Game</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="top-bar">
    <h1>Witchy Hex Game</h1>

    <div class="player-stats">
      <span>Gold: 0</span>
      <span>Reputation: 0</span>
    </div>
  </header>

  <nav class="game-nav">
    <button class="active" data-panel="map-panel">Map</button>
    <button data-panel="inventory-panel">Inventory</button>
    <button data-panel="orders-panel">Orders</button>
    <button data-panel="brew-panel">Brew</button>
  </nav>

  <main class="game-screen">

    <section id="map-panel" class="game-panel active">
        <h2>Explore</h2>

        <div class="hex-map">

            <div class="hex-row">
                <div class="hex-tile" data-row="0" data-col="0"></div>
                <div class="hex-tile" data-row="0" data-col="1"></div>
                <div class="hex-tile" data-row="0" data-col="2"></div>
            </div>

            <div class="hex-row">
                <div class="hex-tile" data-row="1" data-col="0"></div>
                <div class="hex-tile explored" data-row="1" data-col="1"></div>
                <div class="hex-tile" data-row="1" data-col="2"></div>
                <div class="hex-tile" data-row="1" data-col="3"></div>
            </div>

            <div class="hex-row">
                <div class="hex-tile" data-row="2" data-col="0"></div>
                <div class="hex-tile" data-row="2" data-col="1"></div>
                <div class="hex-tile" data-row="2" data-col="2"></div>
            </div>

        </div>
    </section>

    <section id="inventory-panel" class="game-panel">
        <h2>Inventory</h2>

        <p class="backpack-capacity">
            Backpack:
            <span id="backpack-count">0</span>
            /
            <span id="backpack-capacity">5</span>
        </p>

        <div id="inventory-list">
            <p>Your backpack is empty.</p>
        </div>
    </section>

    <section id="orders-panel" class="game-panel">
      <h2>Orders</h2>
      <p>Your customer orders will appear here.</p>
    </section>

    <section id="brew-panel" class="game-panel">
      <h2>Brew</h2>
      <p>Your cauldron and recipes will live here.</p>
    </section>

  </main>

  <script src="script.js"></script>
</body>

</html>
